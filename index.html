<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyOS — JEE Command Center</title>
<script>(function(){try{var t=localStorage.getItem('studyos-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060e;--bg-s:#0c0c1d;--bg-card:#111127;--bg-card-h:#191940;--bg-input:#0a0a1a;
  --accent:#7c5cfc;--accent-l:#a78bfa;--accent-g:rgba(124,92,252,.15);
  --pink:#f472b6;--cyan:#22d3ee;--green:#34d399;--orange:#fb923c;--red:#f87171;--yellow:#fbbf24;
  --text:#eaeaff;--text-s:#9191c8;--text-m:#5a5a8a;
  --border:rgba(124,92,252,.12);--border-s:rgba(124,92,252,.25);
  --r:12px;--r-sm:8px;--sw:240px;
  --phys:#38bdf8;--chem:#34d399;--math:#f472b6;
}
html[data-theme="light"]{
  --bg:#f6f7fb;--bg-s:#eceef5;--bg-card:#ffffff;--bg-card-h:#f0f2f8;--bg-input:#eceef5;
  --text:#1a1d2e;--text-s:#5b6078;--text-m:#8e95ab;
  --border:rgba(124,92,252,.14);--border-s:rgba(124,92,252,.28);
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--accent);color:#fff}
a,button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;min-height:100vh}

.sidebar{width:var(--sw);background:var(--bg-s);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.sidebar-header{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.logo-sub{font-size:11px;color:var(--text-m);margin-top:2px;letter-spacing:.5px}
.nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--text-s);font-size:13.5px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{color:var(--text);background:rgba(124,92,252,.05)}
.nav-item.active{color:var(--accent-l);background:var(--accent-g);border-left:3px solid var(--accent)}
.nav-icon{font-size:15px;width:30px;height:30px;min-width:30px;border-radius:9px;display:grid;place-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);filter:saturate(1.15);transition:transform .2s}
.nav-item:hover .nav-icon{transform:scale(1.08) rotate(-2deg)}
.nav-item.active .nav-icon{transform:scale(1.05)}
.nav-sep{height:1px;background:var(--border);margin:8px 20px}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
.countdown-label{font-size:10px;color:var(--text-m);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.countdown-days{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.countdown-sub{font-size:11px;color:var(--text-m);margin-top:2px}
.daily-goal{margin-top:14px}
.daily-goal-bar{height:4px;background:rgba(124,92,252,.15);border-radius:2px;overflow:hidden;margin-top:6px}
.daily-goal-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:2px;transition:width .3s}
.daily-goal-text{font-size:11px;color:var(--text-m);margin-top:4px}
.theme-toggle-row{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;margin-top:16px}
.theme-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 0;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-s);cursor:pointer;border:none;background:none;transition:all .15s}
.theme-opt.active{background:var(--accent);color:#fff}
.theme-opt:hover:not(.active){color:var(--text)}

.main{flex:1;margin-left:var(--sw);padding:28px 36px 60px;max-width:calc(100% - var(--sw));min-height:100vh}
.page-header{margin-bottom:28px}
.page-title{font-size:26px;font-weight:700;margin-bottom:4px}
.page-subtitle{font-size:14px;color:var(--text-s)}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:border-color .2s}
.card:hover{border-color:var(--border-s)}
.card-title{font-size:13px;font-weight:600;color:var(--text-s);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--text-s);margin-top:6px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-l);transform:translateY(-1px)}
.btn-outline{background:none;border:1px solid var(--border-s);color:var(--text-s)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent-l)}
.btn-danger{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-success{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.2)}
.btn-success:hover{background:rgba(52,211,153,.2)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:none;border:none;color:var(--text-s);padding:6px 10px}
.btn-ghost:hover{color:var(--text)}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;color:var(--text-s);margin-bottom:5px;font-weight:500}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:13.5px;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);outline:none}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13.5px}
th{color:var(--text-m);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:rgba(124,92,252,.03)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-physics{background:rgba(56,189,248,.15);color:var(--phys)}
.badge-chemistry{background:rgba(52,211,153,.15);color:var(--chem)}
.badge-math{background:rgba(244,114,182,.15);color:var(--math)}
.badge-easy{background:rgba(52,211,153,.1);color:var(--green)}
.badge-medium{background:rgba(251,191,36,.1);color:var(--yellow)}
.badge-hard{background:rgba(248,113,113,.1);color:var(--red)}
.progress{height:6px;background:rgba(124,92,252,.1);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
.subject-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.task-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.task-check{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--text-m);border-radius:4px;flex-shrink:0;cursor:pointer;display:grid;place-content:center;background:transparent;transition:all .15s}
.task-check:checked{background:var(--accent);border-color:var(--accent)}
.task-check:checked::after{content:'\2713';color:#fff;font-size:11px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-title-text{font-size:14px;font-weight:500}
.task-done .task-title-text{text-decoration:line-through;color:var(--text-m)}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12px;color:var(--text-m)}
.due-overdue{color:var(--red);font-weight:600}
.task-delete{background:none;border:none;color:var(--text-m);font-size:16px;padding:4px;cursor:pointer}
.task-delete:hover{color:var(--red)}
.timer-display{font-family:'JetBrains Mono',monospace;font-size:72px;font-weight:700;text-align:center;padding:30px;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.timer-controls{display:flex;gap:12px;justify-content:center;margin-top:20px}
.question-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:20px}
.question-text{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:20px}
.option{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;transition:all .15s;font-size:14px}
.option:hover{border-color:var(--accent);background:var(--accent-g)}
.option.selected{border-color:var(--accent);background:var(--accent-g)}
.option.correct{border-color:var(--green);background:rgba(52,211,153,.1);cursor:default}
.option.wrong{border-color:var(--red);background:rgba(248,113,113,.1);cursor:default}
.option-letter{width:28px;height:28px;border-radius:50%;background:rgba(124,92,252,.1);display:grid;place-content:center;font-weight:600;font-size:13px;color:var(--accent-l);flex-shrink:0}
.option.correct .option-letter{background:rgba(52,211,153,.2);color:var(--green)}
.option.wrong .option-letter{background:rgba(248,113,113,.2);color:var(--red)}
.explanation{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:var(--r-sm);padding:14px;margin-top:16px;font-size:13.5px;color:var(--green);line-height:1.5}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:0 4px}
.bar-group{display:flex;flex-direction:column;align-items:center;flex:1}
.bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s;min-height:2px}
.bar-label{font-size:10px;color:var(--text-m);margin-top:6px;text-align:center}
.tabs{display:flex;gap:4px;background:var(--bg-s);border-radius:var(--r-sm);padding:3px;margin-bottom:20px;overflow-x:auto;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-s);cursor:pointer;border:none;background:none;white-space:nowrap;transition:all .15s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){color:var(--text)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-m)}
.empty-state-text{font-size:14px;max-width:300px;margin:0 auto;line-height:1.5}
.modal-overlay{position:fixed;inset:0;background:rgba(6,6,14,.85);z-index:200;display:grid;place-items:center}
.modal{background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--r);padding:24px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:150;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:18px;cursor:pointer}
.hero-card{background:linear-gradient(135deg,rgba(124,92,252,.08),rgba(244,114,182,.08));border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:24px}
.hero-greeting{font-size:22px;font-weight:700;margin-bottom:6px}
.hero-quote{font-size:13px;color:var(--text-s);font-style:italic}
.hero-next{display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:14px 18px;margin-top:16px}
.hero-next-label{font-size:11px;color:var(--text-m);margin-bottom:3px}
.hero-next-title{font-size:15px;font-weight:600}
.hero-next-due{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-s);margin-left:auto;white-space:nowrap}
.subject-card-wrap{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px;overflow:hidden}
.subject-card-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-color)}
.subject-card-name{font-weight:600;font-size:14px;margin:4px 0 10px}
.subject-card-stat{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-m);margin-top:6px}
.form-panel{background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--r);padding:18px;margin-bottom:18px}
.rating-btns{display:flex;gap:8px;flex-wrap:wrap}
.rating-btn{padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--bg-input);color:var(--text-s);cursor:pointer;transition:all .15s}
.rating-btn:hover{border-color:var(--accent);color:var(--accent-l)}
.priority-bar{height:8px;border-radius:4px;overflow:hidden;background:rgba(124,92,252,.08)}
.priority-fill{height:100%;border-radius:4px}
.session-log-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.session-log-dur{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-l);min-width:60px}
.chapter-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13.5px}
.chapter-row:hover{background:rgba(124,92,252,.03)}
.mastery-circle{width:36px;height:36px;border-radius:50%;display:grid;place-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:2px solid}
.plan-slot{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px}
.plan-slot-color{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.plan-slot-info{flex:1}
.plan-slot-name{font-weight:600;font-size:14px}
.plan-slot-meta{font-size:12px;color:var(--text-m);margin-top:2px}
.plan-slot-type{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
.mistake-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.mistake-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mistake-type{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
.analytics-chart{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:20px}
.chart-title{font-size:13px;font-weight:600;color:var(--text-s);margin-bottom:16px}
.mini-stat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.mini-stat:last-child{border-bottom:none}
.mini-stat-val{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:18px;min-width:50px}
.mini-stat-label{font-size:13px;color:var(--text-s)}
.api-key-card{max-width:480px}
.floating-timer{position:fixed;bottom:24px;right:24px;z-index:180;background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--r);padding:14px 18px;box-shadow:0 8px 32px rgba(0,0,0,.25);min-width:220px;animation:fadeIn .3s ease}
.floating-timer-time{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.floating-timer-info{font-size:11px;color:var(--text-s);text-align:center;margin:4px 0 8px}
.floating-timer-btns{display:flex;gap:8px;justify-content:center}
.floating-timer-target{font-size:10px;color:var(--text-m);text-align:center;margin-top:6px}
.floating-timer-progress{height:3px;background:rgba(124,92,252,.1);border-radius:2px;overflow:hidden;margin-top:6px}
.floating-timer-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width 1s linear}
.importance-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.importance-badge.high{background:rgba(248,113,113,.12);color:var(--red)}
.importance-badge.med{background:rgba(251,191,36,.12);color:var(--yellow)}
.importance-badge.low{background:rgba(52,211,153,.12);color:var(--green)}
.chapter-chip{display:inline-flex;padding:5px 12px;border-radius:16px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--bg-input);color:var(--text-s);cursor:pointer;transition:all .15s}
.chapter-chip:hover{border-color:var(--accent);color:var(--text)}
.chapter-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.target-input-group{display:flex;align-items:center;gap:8px;justify-content:center;margin:12px 0}
.target-input-group input{width:60px;text-align:center;padding:6px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:14px;font-family:'JetBrains Mono',monospace}
.target-input-group input:focus{border-color:var(--accent);outline:none}
.target-input-group span{font-size:13px;color:var(--text-s)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:60px 16px 40px;max-width:100%}
  .menu-toggle{display:block}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .timer-display{font-size:48px}
  .form-row{flex-direction:column}
}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-m)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 2s infinite}
</style>
</head>
<body>
<div id="app"><div style="padding:60px;text-align:center;color:#5a5a8a">Loading StudyOS...</div></div>
<script>
(function(){
"use strict";

var LS_KEY='studyos-v2';
var THEME_KEY='studyos-theme';

function loadTheme(){
  try{var t=localStorage.getItem(THEME_KEY);if(t==='light'||t==='dark')return t}catch(e){}
  return 'dark';
}
var currentTheme=loadTheme();
function applyTheme(){document.documentElement.setAttribute('data-theme',currentTheme)}
function setTheme(t){
  if(t!=='light'&&t!=='dark')return;
  currentTheme=t;
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
  applyTheme();render();
}
applyTheme();

var JEE_SUBJECTS=[
{id:'physics',name:'Physics',color:'#38bdf8',chapters:[
  {id:'ph_kin',name:'Kinematics',w:8},{id:'ph_law',name:'Laws of Motion',w:10},{id:'ph_wep',name:'Work, Energy & Power',w:8},
  {id:'ph_rot',name:'Rotational Motion',w:8},{id:'ph_grav',name:'Gravitation',w:5},{id:'ph_therm',name:'Thermodynamics',w:7},
  {id:'ph_osc',name:'Oscillations & Waves',w:7},{id:'ph_elec',name:'Electrostatics',w:10},{id:'ph_curr',name:'Current Electricity',w:8},
  {id:'ph_mag',name:'Magnetism',w:7},{id:'ph_emi',name:'EMI & AC',w:6},{id:'ph_opt',name:'Optics',w:8},
  {id:'ph_mod',name:'Modern Physics',w:6},{id:'ph_semi',name:'Semiconductors',w:2}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtTime(sec){var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function fmtMin(min){if(min<60)return min+'m';var h=Math.floor(min/60),m=min%60;return h+'h'+(m>0?' '+m+'m':'')}
function fmtDue(iso){
  var due=new Date(iso+'T00:00:00'),today=new Date(todayISO()+'T00:00:00'),diff=Math.round((due-today)/864e5);
  if(diff===0)return{text:'Today',over:false};if(diff===1)return{text:'Tomorrow',over:false};
  if(diff<0)return{text:Math.abs(diff)+'d overdue',over:true};if(diff<=7)return{text:'In '+diff+'d',over:false};
  return{text:due.toLocaleDateString('en-US',{month:'short',day:'numeric'}),over:false};
}
function daysUntilExam(){var e=new Date(state.examDate+'T00:00:00'),t=new Date(todayISO()+'T00:00:00');return Math.max(0,Math.round((e-t)/864e5))}
function greeting(){var h=new Date().getHours();if(h<5)return"Burning the midnight oil? Rest well.";if(h<12)return'Good morning. Ready to conquer today?';if(h<17)return'Good afternoon. Keep pushing.';if(h<21)return'Good evening. Great time to revise.';return'Night owl mode. Quality over quantity.'}
function todayQuote(){var idx=Math.floor(Date.now()/864e5)%QUOTES.length;return QUOTES[idx]}
function updateStreak(){
  var today=todayISO();if(state.lastActiveDate===today)return;
  var yd=new Date(new Date(today+'T00:00:00').getTime()-864e5).toISOString().slice(0,10);
  if(state.lastActiveDate!==yd&&state.lastActiveDate!==today)state.streak=0;
}
function markActive(){
  var today=todayISO();if(state.lastActiveDate===today)return;
  var yd=new Date(new Date(today+'T00:00:00').getTime()-864e5).toISOString().slice(0,10);
  state.streak=state.lastActiveDate===yd?state.streak+1:1;

}

}

  return t>0?Math.round(c/t*100):0;

  var sub=getSubject(subId);if(!sub)return 0;
  var total=0,sum=0;sub.chapters.forEach(function(c){var p=getProgress(c.id);total++;sum+=p.mastery});
  return total>0?Math.round(sum/total):0;
}

function sm2(quality,chapterId){
  var rev=state.revisionSchedule[chapterId]||{nextReview:todayISO(),interval:0,easeFactor:2.5,repetitions:0};
  if(quality<3){rev.repetitions=0;rev.interval=1}else{
    if(rev.repetitions===0)rev.interval=1;else if(rev.repetitions===1)rev.interval=6;else rev.interval=Math.round(rev.interval*rev.easeFactor);
    rev.repetitions++;
  }
  rev.easeFactor=Math.max(1.3,rev.easeFactor+0.1-(5-quality)*(0.08+(5-quality)*0.02));
  var next=new Date(todayISO()+'T00:00:00');next.setDate(next.getDate()+rev.interval);
  rev.nextReview=next.toISOString().slice(0,10);rev.lastReviewed=todayISO();
  state.revisionSchedule[chapterId]=rev;
  var prog=getProgress(chapterId);
  prog.mastery=Math.min(100,Math.max(0,prog.mastery+([-20,-10,-5,5,10,15][quality]||0)));
  prog.lastStudied=todayISO();
  state.chapterProgress[chapterId]=prog;
  markActive();saveState();
}

function calculatePriority(ch){
  var prog=getProgress(ch.id),rev=state.revisionSchedule[ch.id]||{},score=0;
  score+=(100-(prog.mastery||0))*0.4;score+=(ch.w||5)*1.5;
  if(rev.nextReview&&rev.nextReview<=todayISO()){var od=Math.round((new Date(todayISO()+'T00:00:00')-new Date(rev.nextReview+'T00:00:00'))/864e5);score+=Math.min(30,od*3)}
  if(prog.lastStudied){var ds=Math.round((new Date(todayISO()+'T00:00:00')-new Date(prog.lastStudied+'T00:00:00'))/864e5);score+=Math.min(15,ds)}else score+=15;
  return Math.min(100,Math.round(score));
}

function generateStudyPlan(){
  var daily=state.dailyStudyMinutes||480,slots=[],remaining=daily,dur=45;
  var focus=state.plannerFocusChapters||[];
  var pool=focus.length>0?ALL_CHAPTERS.filter(function(c){return focus.indexOf(c.id)!==-1}):ALL_CHAPTERS;
  var sorted=pool.map(function(c){return{ch:c,pri:calculatePriority(c)}}).sort(function(a,b){return b.pri-a.pri});
  sorted.forEach(function(item){
    if(remaining<dur)return;
    var rev=state.revisionSchedule[item.ch.id];
    if(rev&&rev.nextReview&&rev.nextReview<=todayISO()){
      slots.push({chId:item.ch.id,name:item.ch.name,sub:item.ch.subjectName,color:item.ch.subjectColor,dur:dur,type:'Revision',pri:item.pri});
      remaining-=dur;
    }
  });
  sorted.forEach(function(item){
    if(remaining<dur)return;if(slots.find(function(s){return s.chId===item.ch.id}))return;
    var prog=getProgress(item.ch.id);
    var type=prog.mastery<30?'New Topic':prog.mastery<70?'Practice':'Strengthen';
    slots.push({chId:item.ch.id,name:item.ch.name,sub:item.ch.subjectName,color:item.ch.subjectColor,dur:dur,type:type,pri:item.pri});
    remaining-=dur;
  });
  return slots;
}

function dueRevisions(){
  var today=todayISO(),due=[];
  ALL_CHAPTERS.forEach(function(ch){
    var rev=state.revisionSchedule[ch.id];
    if(rev&&rev.nextReview&&rev.nextReview<=today)due.push({ch:ch,rev:rev,overdue:Math.round((new Date(today+'T00:00:00')-new Date(rev.nextReview+'T00:00:00'))/864e5)});
  });
  return due.sort(function(a,b){return b.overdue-a.overdue});
}

function renderAnalytics(){
  var acc=overallAccuracy();
  var totalQ=state.practiceResults.reduce(function(a,r){return a+r.total},0);
  var totalMin=state.studySessions.reduce(function(a,s){return a+Math.round(s.duration/60)},0);
  var totalMistakes=state.mistakes.length;

  var last7=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);last7.push(d.toISOString().slice(0,10))}
  var dailyMin=last7.map(function(day){return{day:day,min:state.studySessions.filter(function(s){return s.date===day}).reduce(function(a,s){return a+Math.round(s.duration/60)},0)}});
  var maxMin=Math.max.apply(null,dailyMin.map(function(d){return d.min}))||1;

  var subjectStats=JEE_SUBJECTS.map(function(s){return{name:s.name,color:s.color,acc:subjectAccuracy(s.id),min:subjectStudyMin(s.id),mastery:subjectMastery(s.id)}});

  return '<div class="page-header"><div class="page-title">Performance Analytics</div><div class="page-subtitle">Track your accuracy, study time, and improvement over time</div></div>'+
    '<div class="stats-grid">'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--green)">'+acc+'%</div><div class="stat-label">Overall accuracy</div></div>'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--cyan)">'+totalQ+'</div><div class="stat-label">Total questions</div></div>'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--orange)">'+fmtMin(totalMin)+'</div><div class="stat-label">Total study time</div></div>'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--red)">'+totalMistakes+'</div><div class="stat-label">Mistakes logged</div></div>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div class="analytics-chart"><div class="chart-title">Study Time (Last 7 Days)</div>'+
        '<div class="bar-chart">'+dailyMin.map(function(d){
          var pct=Math.max(2,d.min/maxMin*100);
          return '<div class="bar-group"><div class="bar" style="height:'+pct+'%;background:linear-gradient(to top,var(--accent),var(--cyan))"></div><div class="bar-label">'+d.day.slice(5)+'</div></div>';
        }).join('')+'</div>'+
      '</div>'+
      '<div class="analytics-chart"><div class="chart-title">Subject Breakdown</div>'+
        subjectStats.map(function(s){
          return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:500">'+s.name+'</span><span style="color:var(--text-s)">'+s.acc+'% acc · '+fmtMin(s.min)+'</span></div>'+
            '<div class="progress"><div class="progress-fill" style="width:'+s.mastery+'%;background:'+s.color+'"></div></div></div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div class="analytics-chart"><div class="chart-title">Chapter Mastery Map</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px">'+ALL_CHAPTERS.map(function(ch){
        var m=getProgress(ch.id).mastery;
        var color=m>=80?'var(--green)':m>=50?'var(--yellow)':m>=20?'var(--orange)':'var(--red)';
        if(m===0)color='var(--text-m)';
        return '<div title="'+ch.name+': '+m+'%" style="width:28px;height:28px;border-radius:4px;background:'+(m>0?color:'var(--bg-s)')+';opacity:'+(m>0?0.3+m/100*0.7:0.15)+';border:1px solid var(--border);display:grid;place-content:center;font-size:8px;color:#fff;font-weight:600;cursor:default">'+(m>0?m:'')+'</div>';
      }).join('')+'</div>'+
      '<div style="margin-top:8px;font-size:11px;color:var(--text-m)">Each cell = one chapter. Hover for details.</div>'+
    '</div>';
}

function renderMistakes(){
  var filter=currentMistakeFilter||'all';
  var filtered=state.mistakes.slice();
  if(filter!=='all')filtered=filtered.filter(function(m){return m.subjectId===filter});
  filtered.sort(function(a,b){return b.date.localeCompare(a.date)});

  var typeCounts={};MISTAKE_TYPES.forEach(function(t){typeCounts[t]=0});
  state.mistakes.forEach(function(m){typeCounts[m.errorType]=(typeCounts[m.errorType]||0)+1});
  var topType=Object.keys(typeCounts).reduce(function(a,b){return typeCounts[a]>typeCounts[b]?a:b},'');

  return '<div class="page-header"><div class="page-title">Mistake Bank</div><div class="page-subtitle">Log mistakes and identify recurring error patterns</div></div>'+
    '<div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--red)">'+state.mistakes.length+'</div><div class="stat-label">Total mistakes</div></div>'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--yellow);font-size:18px">'+topType+'</div><div class="stat-label">Most common type</div></div>'+
      '<div class="stat-card"><div class="stat-value" style="color:var(--green)">'+Object.keys(typeCounts).filter(function(t){return typeCounts[t]>0}).length+'</div><div class="stat-label">Error categories</div></div>'+
    '</div>'+
    '<button class="btn btn-primary" data-action="add-mistake" style="margin-bottom:20px">+ Log New Mistake</button>'+
    '<div class="tabs">'+
      '<button class="tab'+(filter==='all'?' active':'')+'" data-mistake-filter="all">All</button>'+
      JEE_SUBJECTS.map(function(s){return '<button class="tab'+(filter===s.id?' active':'')+'" data-mistake-filter="'+s.id+'">'+s.name+'</button>'}).join('')+
    '</div>'+
    (filtered.length===0?'<div class="card"><div class="empty-state"><div class="empty-state-text">No mistakes logged yet. After practice, log your errors to identify patterns.</div></div></div>':
    filtered.slice(0,20).map(function(m){
      var ch=getChapterInfo(m.chapterId);var typeColor=m.errorType==='Conceptual'?'var(--red)':m.errorType==='Calculation'?'var(--orange)':m.errorType==='Silly/Careless'?'var(--yellow)':'var(--text-s)';
      return '<div class="mistake-card"><div class="mistake-card-header"><div><span class="badge badge-'+m.subjectId+'">'+((ch&&ch.subjectName)||'')+'</span> <span style="font-size:12px;color:var(--text-m)">'+(ch?ch.name:'')+'</span></div>'+
        '<div><span class="mistake-type" style="background:rgba(255,255,255,.05);color:'+typeColor+'">'+m.errorType+'</span>'+
        '<button class="btn-ghost" style="margin-left:8px;font-size:14px" data-del-mistake="'+m.id+'">×</button></div></div>'+
        '<div style="font-size:14px;margin-bottom:6px">'+escHtml(m.question)+'</div>'+
        (m.notes?'<div style="font-size:12px;color:var(--text-m)">'+escHtml(m.notes)+'</div>':'')+
        '<div style="font-size:11px;color:var(--text-m);margin-top:6px">'+m.date+'</div></div>';
    }).join(''));
}

function renderPracticeSession(){
  var q=practiceState.questions[practiceState.idx];
  if(!q)return renderPracticeSummary();
  var letters=['A','B','C','D'];

  return '<div class="page-header"><div class="page-title">Practice</div><div class="page-subtitle">Question '+(practiceState.idx+1)+' of '+practiceState.questions.length+'</div></div>'+
    '<div class="progress" style="margin-bottom:20px"><div class="progress-fill" style="width:'+((practiceState.idx+1)/practiceState.questions.length*100)+'%;background:linear-gradient(90deg,var(--accent),var(--pink))"></div></div>'+
    '<div class="question-card">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:12px"><span class="badge badge-'+q.sub+'">'+((getSubject(q.sub)||{}).name||'')+'</span><span class="badge badge-'+q.d+'">'+q.d.charAt(0).toUpperCase()+q.d.slice(1)+'</span></div>'+
      '<div class="question-text">'+q.q+'</div>'+
      q.o.map(function(opt,i){
        var cls='option';
        if(practiceState.answered){
          if(i===q.c)cls+=' correct';
          else if(i===practiceState.sel)cls+=' wrong';
        }else if(i===practiceState.sel)cls+=' selected';
        return '<div class="'+cls+'" data-answer="'+i+'"><div class="option-letter">'+letters[i]+'</div><div>'+opt+'</div></div>';
      }).join('')+
      (practiceState.answered?'<div class="explanation"><strong>Explanation:</strong> '+q.e+'</div>'+
        '<div class="form-actions" style="margin-top:14px"><button class="btn btn-primary" data-action="next-question">'+(practiceState.idx<practiceState.questions.length-1?'Next Question':'See Results')+'</button></div>':
        (practiceState.sel!==null?'<div class="form-actions"><button class="btn btn-primary" data-action="submit-answer">Submit Answer</button></div>':''))+
    '</div>';
}

function renderPracticeSummary(){

  return '<div class="page-header"><div class="page-title">Practice Complete!</div></div>'+

      '<div style="font-size:64px;font-family:\'JetBrains Mono\',monospace;font-weight:700;background:linear-gradient(135deg,'+(pct>=70?'var(--green),var(--cyan)':pct>=40?'var(--yellow),var(--orange)':'var(--red),var(--pink)')+');-webkit-background-clip:text;-webkit-text-fill-color:transparent">'+pct+'%</div>'+

      '<div style="color:var(--text-s);margin-top:4px">'+(pct>=80?'Excellent work!':pct>=60?'Good effort, keep practicing!':pct>=40?'Room for improvement.':'Focus on basics and try again.')+'</div>'+

    '<div id="floating-timer-time" class="floating-timer-time">'+timeStr+'</div>'+
    '<div class="floating-timer-info">'+escHtml(info)+'</div>'+
    (timerState.targetSeconds>0?'<div class="floating-timer-progress"><div class="floating-timer-progress-fill" style="width:'+targetPct+'%"></div></div>'+
      '<div class="floating-timer-target">'+targetPct+'% of '+fmtTime(timerState.targetSeconds)+'</div>':'')+
    '<div class="floating-timer-btns">'+
      (!timerState.running?'<button class="btn btn-sm btn-primary" data-action="start-timer">Resume</button>':'<button class="btn btn-sm btn-outline" data-action="pause-timer">Pause</button>')+
      '<button class="btn btn-sm btn-danger" data-action="stop-timer">Stop</button>'+
      '<button class="btn btn-sm btn-outline" data-nav="sessions">Open</button>'+
    '</div></div>';
}

function render(){
  var pages={dashboard:renderDashboard,planner:renderPlanner,priority:renderPriority,revision:renderRevision,analytics:renderAnalytics,mistakes:renderMistakes,practice:renderPractice,sessions:renderSessions};
  var pageFn=pages[currentPage]||renderDashboard;

  app.innerHTML='<button class="menu-toggle" data-action="toggle-sidebar">☰</button>'+renderSidebar()+'<main class="main fade-in">'+pageFn()+'</main>'+renderModal()+renderFloatingTimer();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(function(el){el.onclick=function(){navigate(el.getAttribute('data-nav'))}});
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.onclick=function(e){
      var a=el.getAttribute('data-action');
      if(a==='toggle-sidebar'){sidebarOpen=!sidebarOpen;render()}
      else if(a==='set-theme'){setTheme(el.getAttribute('data-theme-value'))}
      else if(a==='add-task'){modalType='add-task';render()}
      else if(a==='add-mistake'){modalType='add-mistake';render();populateMistakeChapters()}
      else if(a==='close-modal'){modalType=null;render()}
      else if(a==='save-task'){
        var title=document.getElementById('modal-task-title').value;
        var due=document.getElementById('modal-task-due').value;
        var sub=document.getElementById('modal-task-subject').value;
        if(!title.trim()||!due)return;
        state.tasks.push({id:uid(),title:title.trim(),subjectId:sub||null,dueDate:due,done:false,completedAt:null});
        modalType=null;saveState();render();
      }
      else if(a==='save-mistake'){
        var q=document.getElementById('modal-mis-question').value;
        var subId=document.getElementById('modal-mis-subject').value;
        var chId=document.getElementById('modal-mis-chapter').value;
        var type=document.getElementById('modal-mis-type').value;
        var notes=document.getElementById('modal-mis-notes').value;
        if(!q.trim())return;
        state.mistakes.push({id:uid(),subjectId:subId,chapterId:chId,question:q.trim(),errorType:type,notes:notes,date:todayISO()});
        modalType=null;markActive();saveState();render();
      }
      else if(a==='save-plan-settings'){
        state.examDate=document.getElementById('exam-date').value;
        state.dailyStudyMinutes=parseInt(document.getElementById('daily-hours').value)*60||480;
        saveState();render();
      }
      else if(a==='clear-focus'){state.plannerFocusChapters=[];saveState();render()}
      else if(a==='add-manual-slot'){modalType='add-manual-slot';render();populateManualChapters()}
      else if(a==='save-manual-slot'){
        var mSub=document.getElementById('modal-manual-subject').value;
        var mCh=document.getElementById('modal-manual-chapter').value;
        var mDur=parseInt(document.getElementById('modal-manual-dur').value)||45;
        if(!mCh)return;
        if(!state.manualPlan)state.manualPlan=[];
        state.manualPlan.push({id:uid(),subjectId:mSub,chapterId:mCh,duration:mDur});
        modalType=null;saveState();render();
      }
      else if(a==='save-session-notes'){saveCompletedSession()}
      else if(a==='skip-session-notes'){saveCompletedSession()}
      else if(a==='set-target'){
        var th=parseInt(document.getElementById('target-hours').value)||0;
        var tm=parseInt(document.getElementById('target-minutes').value)||0;
        timerState.targetSeconds=th*3600+tm*60;render();
      }
      else if(a==='start-practice'){startPractice()}
      else if(a==='submit-answer'){submitAnswer()}
      else if(a==='next-question'){nextQuestion()}
      else if(a==='end-practice'){practiceState.active=false;render()}
      else if(a==='start-timer'){startTimer()}
      else if(a==='pause-timer'){pauseTimer()}
      else if(a==='stop-timer'){stopTimer()}
      else if(a==='start-review'){
        var chSel=document.getElementById('rev-chapter');if(!chSel||!chSel.value)return;
        revisionRating.chapterId=chSel.value;render();
      }
      else if(a==='cancel-review'){revisionRating.chapterId=null;render()}
      
    }
  });

  document.querySelectorAll('[data-toggle-task]').forEach(function(el){
    el.onchange=function(){
      var id=el.getAttribute('data-toggle-task');
      var t=state.tasks.find(function(t){return t.id===id});if(!t)return;
      t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;
      if(t.done)markActive();
      saveState();render();
    }
  });

  document.querySelectorAll('[data-del-task]').forEach(function(el){
    el.onclick=function(){state.tasks=state.tasks.filter(function(t){return t.id!==el.getAttribute('data-del-task')});saveState();render()}
  });

  document.querySelectorAll('[data-del-mistake]').forEach(function(el){
    el.onclick=function(){state.mistakes=state.mistakes.filter(function(m){return m.id!==el.getAttribute('data-del-mistake')});saveState();render()}
  });

  document.querySelectorAll('[data-answer]').forEach(function(el){
    el.onclick=function(){if(practiceState.answered)return;practiceState.sel=parseInt(el.getAttribute('data-answer'));render()}
  });

  document.querySelectorAll('[data-rate]').forEach(function(el){
    el.onclick=function(){
      var q=parseInt(el.getAttribute('data-rate'));
      sm2(q,revisionRating.chapterId);
      revisionRating.chapterId=null;render();
    }
  });

  document.querySelectorAll('[data-review]').forEach(function(el){
    el.onclick=function(){revisionRating.chapterId=el.getAttribute('data-review');render()}
  });

  document.querySelectorAll('[data-planner-mode]').forEach(function(el){
    el.onclick=function(){plannerMode=el.getAttribute('data-planner-mode');render()}
  });

  document.querySelectorAll('[data-focus-ch]').forEach(function(el){
    el.onclick=function(){
      var chId=el.getAttribute('data-focus-ch');
      if(!state.plannerFocusChapters)state.plannerFocusChapters=[];
      var idx=state.plannerFocusChapters.indexOf(chId);
      if(idx===-1)state.plannerFocusChapters.push(chId);
      else state.plannerFocusChapters.splice(idx,1);
      saveState();render();
    }
  });

  document.querySelectorAll('[data-del-manual]').forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute('data-del-manual');
      state.manualPlan=state.manualPlan.filter(function(s){return s.id!==id});
      saveState();render();
    }
  });

  document.querySelectorAll('[data-pri-filter]').forEach(function(el){
    el.onclick=function(){currentPriorityFilter=el.getAttribute('data-pri-filter');render()}
  });

  document.querySelectorAll('[data-mistake-filter]').forEach(function(el){
    el.onclick=function(){currentMistakeFilter=el.getAttribute('data-mistake-filter');render()}
  });
  var currentMistakeFilter=currentMistakeFilter;

  document.querySelectorAll('[data-start-session]').forEach(function(el){
    el.onclick=function(){
      timerState.chapterId=el.getAttribute('data-start-session');
      timerState.subjectId=el.getAttribute('data-sub');
      navigate('sessions');
    }
  });

  var pracSubject=document.getElementById('prac-subject');
  if(pracSubject){
    pracSubject.onchange=function(){
      var ch=document.getElementById('prac-chapter');if(!ch)return;
      ch.innerHTML='<option value="all">All Chapters</option>';
      if(pracSubject.value!=='all'){
        var sub=getSubject(pracSubject.value);
        if(sub)sub.chapters.forEach(function(c){ch.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>'});
      }
    }
  }

  var sesSubject=document.getElementById('session-subject');
  if(sesSubject){
    sesSubject.onchange=function(){
      timerState.subjectId=sesSubject.value;
      var ch=document.getElementById('session-chapter');if(!ch)return;
      ch.innerHTML='<option value="">Select chapter...</option>';
      if(sesSubject.value){
        var sub=getSubject(sesSubject.value);
        if(sub)sub.chapters.forEach(function(c){ch.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>'});
      }
    }
  }
  var sesCh=document.getElementById('session-chapter');
  if(sesCh){sesCh.onchange=function(){timerState.chapterId=sesCh.value}}

  var manualSubject=document.getElementById('modal-manual-subject');
  if(manualSubject){manualSubject.onchange=function(){populateManualChapters()}}

  var misSubject=document.getElementById('modal-mis-subject');
  if(misSubject){misSubject.onchange=function(){populateMistakeChapters()}}

  }

function populateManualChapters(){
  var subSel=document.getElementById('modal-manual-subject');
  var chSel=document.getElementById('modal-manual-chapter');
  if(!subSel||!chSel)return;
  chSel.innerHTML='<option value="">Select chapter...</option>';
  var sub=getSubject(subSel.value);
  if(sub)sub.chapters.forEach(function(c){chSel.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>'});
}

function populateMistakeChapters(){
  var subSel=document.getElementById('modal-mis-subject');
  var chSel=document.getElementById('modal-mis-chapter');
  if(!subSel||!chSel)return;
  chSel.innerHTML='<option value="">Select chapter...</option>';
  var sub=getSubject(subSel.value);
  if(sub)sub.chapters.forEach(function(c){chSel.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>'});
}

function startPractice(){
  var subFilter=document.getElementById('prac-subject').value;
  var chFilter=document.getElementById('prac-chapter').value;
  var diffFilter=document.getElementById('prac-diff').value;

  var qs=QUESTIONS.filter(function(q){
    if(subFilter!=='all'&&q.sub!==subFilter)return false;
    if(chFilter!=='all'&&q.ch!==chFilter)return false;
    if(diffFilter!=='all'&&q.d!==diffFilter)return false;
    return true;
  });

  if(qs.length===0){alert('No questions match your filters. Try broader criteria.');return}

  for(var i=qs.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=qs[i];qs[i]=qs[j];qs[j]=tmp}
  qs=qs.slice(0,Math.min(15,qs.length));

  practiceState={active:true,questions:qs,idx:0,sel:null,answered:false,results:[],
    filters:{subject:subFilter,chapter:chFilter,difficulty:diffFilter},
    startTime:Date.now(),questionStart:Date.now()};
  render();
}

function submitAnswer(){
  if(practiceState.sel===null)return;
  practiceState.answered=true;
  var q=practiceState.questions[practiceState.idx];
  var correct=practiceState.sel===q.c;
  practiceState.results.push({qId:q.id,sel:practiceState.sel,correct:correct,time:Math.round((Date.now()-practiceState.questionStart)/1000)});

  if(correct){
    var prog=getProgress(q.ch);prog.correctQ++;prog.totalQ++;
    prog.mastery=Math.min(100,prog.mastery+3);prog.lastStudied=todayISO();
    state.chapterProgress[q.ch]=prog;
  }else{
    var prog2=getProgress(q.ch);prog2.totalQ++;
    prog2.mastery=Math.max(0,prog2.mastery-1);
    state.chapterProgress[q.ch]=prog2;
  }
  saveState();render();
}

function nextQuestion(){
  practiceState.idx++;practiceState.sel=null;practiceState.answered=false;practiceState.questionStart=Date.now();
  if(practiceState.idx>=practiceState.questions.length){
    var totalCorrect=practiceState.results.filter(function(r){return r.correct}).length;
    var totalTime=Math.round((Date.now()-practiceState.startTime)/1000);
    var subId=practiceState.filters.subject!=='all'?practiceState.filters.subject:'mixed';
    state.practiceResults.push({id:uid(),subjectId:subId,chapterId:practiceState.filters.chapter,
      difficulty:practiceState.filters.difficulty,total:practiceState.results.length,correct:totalCorrect,
      timeTaken:totalTime,date:todayISO()});
    markActive();saveState();
  }
  render();
}

function startTimer(){
  if(timerState.running)return;
  timerState.running=true;
  if(!timerState.startTime)timerState.startTime=new Date();
  timerState.intervalId=setInterval(function(){
    timerState.seconds++;
    var el=document.getElementById('timer-display');
    if(el)el.textContent=fmtTime(timerState.seconds);
    var fel=document.getElementById('floating-timer-time');
    if(fel)fel.textContent=fmtTime(timerState.seconds);
    if(timerState.targetSeconds>0&&timerState.seconds===timerState.targetSeconds){
      try{if(Notification&&Notification.permission==='granted')new Notification('StudyOS',{body:'Target duration reached!'})}catch(e){}
    }
  },1000);
  render();
}

function pauseTimer(){
  if(!timerState.running)return;
  timerState.running=false;
  clearInterval(timerState.intervalId);
  render();
}

var stoppedSession=null;

function stopTimer(){
  clearInterval(timerState.intervalId);
  timerState.running=false;
  if(timerState.seconds>30){
    stoppedSession={
      id:uid(),subjectId:timerState.subjectId||null,chapterId:timerState.chapterId||null,
      startTime:timerState.startTime?timerState.startTime.toISOString():new Date().toISOString(),
      endTime:new Date().toISOString(),duration:timerState.seconds,date:todayISO(),
      targetDuration:timerState.targetSeconds||0,progressNotes:''
    };
    modalType='session-complete';
    timerState={running:false,seconds:0,subjectId:null,chapterId:null,intervalId:null,startTime:null,targetSeconds:0};
    render();
  }else{
    timerState={running:false,seconds:0,subjectId:null,chapterId:null,intervalId:null,startTime:null,targetSeconds:0};
    render();
  }
}

function saveCompletedSession(){
  if(!stoppedSession)return;
  var notesEl=document.getElementById('modal-session-notes');
  if(notesEl)stoppedSession.progressNotes=notesEl.value.trim();
  state.studySessions.push(stoppedSession);
  if(stoppedSession.chapterId){
    var prog=getProgress(stoppedSession.chapterId);
    prog.studyMinutes+=Math.round(stoppedSession.duration/60);
    prog.lastStudied=todayISO();
    state.chapterProgress[stoppedSession.chapterId]=prog;
  }
  markActive();saveState();
  stoppedSession=null;modalType=null;render();
}

var currentMistakeFilter='all';

loadState();
render();
})();
</script>
